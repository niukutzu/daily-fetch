<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0e10">
<title>黎明简报</title>
<!-- v2 -->
<link rel="alternate" type="application/rss+xml" title="黎明简报 · 全部" href="feeds/all.xml">
<style>
:root{
  --bg:#0e0e10; --side:#121214; --raise:#18181b; --card:#1a1a1e; --hover:#1c1c20; --sel:#232328;
  --line:#222226; --line2:#2a2a2f; --text:#ececef; --sub:#a1a1aa; --muted:#8b8b93;
  --blue:#3b82f6; --blue2:#2563eb; --chipbg:#1e293b; --chip:#93c5fd; --link:#7fb0ff; --green:#22c55e; --red:#f87171;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",Inter,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;text-align:inherit}
a{color:var(--link);text-decoration:none}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch}
.scroll::-webkit-scrollbar{width:8px}.scroll::-webkit-scrollbar-thumb{background:#2a2a2f;border-radius:4px}
.app{display:flex;height:100vh;height:100dvh;overflow:hidden}
.av{flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff}
.ico-btn{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}
.ico-btn:hover{background:var(--hover)}
.ico-btn.on{background:#26262c}

/* 左栏 */
.side{width:320px;flex:none;display:flex;flex-direction:column;background:var(--side);border-right:1px solid var(--line)}
.side{background:radial-gradient(120% 220px at 0 0,rgba(251,146,60,.10),rgba(244,63,94,.04) 55%,transparent 100%),var(--side)}
.side-top{display:flex;align-items:center;gap:12px;padding:20px 18px 14px}
.logo{width:38px;height:38px;flex:none;border-radius:11px;background:#1a1a1e;border:1px solid #2a2a2f;display:flex;align-items:center;justify-content:center}
.brand{flex:1;min-width:0}
.side-top h1{margin:0;font-size:19px;line-height:1.2;letter-spacing:1.5px;font-weight:700}
.side-top small{display:block;margin-top:3px;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-top small b{font-weight:500;color:#fdba74}
.search{display:flex;align-items:center;gap:8px;height:40px;margin:0 14px 10px;padding:0 12px;border-radius:12px;background:var(--hover)}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--text);font:inherit;font-size:16px}
.search input::placeholder{color:#7d7d85}
.bots{flex:1;padding:0 8px 12px}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:10px;border-radius:14px}
.row:hover{background:var(--hover)}
.row.on{background:var(--sel)}
.row .av{width:46px;height:46px;font-size:17px}
.row.paused .av{opacity:.45}
.row .mid{flex:1;min-width:0}
.row .l1,.row .l2{display:flex;align-items:center;gap:6px}
.row .nm{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.paused .nm{color:var(--muted)}
.row .tm{font-size:12px;color:var(--muted);flex:none}
.row .pv{flex:1;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--blue);flex:none}
.ptag{font-size:11px;color:var(--sub);border:1px solid #34343a;border-radius:6px;padding:0 5px;flex:none}
.av.sm{width:20px;height:20px;font-size:10px}
.av.sm img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.hitn{padding:8px 12px 4px;font-size:12px;color:var(--muted)}
.sres{display:flex;flex-direction:column;gap:2px;width:100%;min-width:0;padding:8px 10px;border-radius:12px;text-align:left}
.sres:hover{background:var(--hover)}
.sres .h{display:flex;align-items:center;gap:6px;min-width:0}
.sres .nm{flex:1;min-width:0;font-size:12px;font-weight:600;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sres .tm{flex:none;font-size:12px;color:var(--muted)}
.sres .tt{min-width:0;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sres .sx{font-size:13px;line-height:1.45;color:var(--sub);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.more50{display:block;width:calc(100% - 8px);margin:6px 4px 10px;padding:8px;border-radius:10px;background:var(--hover);color:var(--sub);font-size:13px}
mark{background:transparent;color:#fdba74;font-weight:600}
.art li.hit,.art p.hit,.art tr.hit{border-radius:8px;background:rgba(251,146,60,.18);animation:hitfade 2s ease forwards}
.art tr.hit td{background:rgba(251,146,60,.18);animation:hitfade 2s ease forwards}
@keyframes hitfade{from{background:rgba(251,146,60,.18)}to{background:transparent}}

/* 中栏 */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.hdr{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;height:64px;padding:0 20px;border-bottom:1px solid var(--line);flex:none}
.hdr .av{width:32px;height:32px;font-size:14px}
.hdr .who{min-width:0;max-width:100%;display:flex;align-items:center;gap:10px;height:46px;padding:0 12px 0 7px;border-radius:23px;background:#1c1c20;border:1px solid #2a2a2f}
.hdr .who .nm{font-size:16px}
.hdr .who:hover,.hdr .who.on{background:#26262b}
.hdr .who .chev{color:var(--muted);flex:none;width:0;opacity:0;margin-left:-6px;transition:opacity .15s,width .15s,margin .15s}
.hdr .who:hover .chev,.hdr .who:focus-visible .chev{width:16px;opacity:1;margin-left:0}
.hdr .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .st{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .back{display:none}
.hdr .l{display:flex;justify-content:flex-start}
.body{flex:1;padding:24px 20px 40px}
.wrap{max-width:720px;margin:0 auto}
.day{text-align:center;font-size:12px;color:#7d7d85;margin:22px 0 12px}
.msg{display:flex;gap:12px;align-items:flex-start}
.msg>.av{width:32px;height:32px;font-size:13px}
.bubble{flex:1;min-width:0;background:var(--raise);border:1px solid #232327;border-radius:18px;border-top-left-radius:6px;padding:16px 18px}
.greet{color:#d4d4d8}
.its{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.it{display:block;width:100%}
.chip{display:inline-block;font-size:12px;color:var(--chip);background:var(--chipbg);border-radius:6px;padding:1px 7px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.it .t{display:block;font-weight:600;margin-top:4px}
.it .x{display:block;font-size:14px;color:var(--sub)}
.it:hover .t{color:#fff;text-decoration:underline;text-decoration-color:#555}
.rcard{display:flex;align-items:center;gap:14px;width:100%;margin-top:16px;padding:14px;border:1px solid var(--line2);border-radius:14px;background:#111113}
.rcard:hover{border-color:#3a3a42}
.rcard .ic{width:44px;height:44px;flex:none;border-radius:10px;background:#222228;display:flex;align-items:center;justify-content:center}
.rcard .tx{flex:1;min-width:0}
.rcard .t{display:block;font-weight:600}
.rcard .s{display:block;font-size:13px;color:var(--muted)}
.rcard .go{font-size:13px;color:var(--chip);flex:none}
.bubble.old{padding:12px 14px}
.bubble.old .rcard{margin-top:0}
.empty{color:var(--muted);text-align:center;padding:18vh 20px 0;line-height:1.8}

/* 阅读 */
.art h1{font-size:26px;line-height:1.35;margin:0}
.art .meta{font-size:13px;color:var(--muted);margin:6px 0 20px}
.art h2{font-size:18px;margin:30px 0 12px;padding-bottom:8px;border-bottom:1px solid #26262b}
.art h3{font-size:16px;margin:22px 0 8px;color:#d4d4d8}
.art p,.art li{line-height:1.8}
.art ul,.art ol{padding-left:22px}
.art li{margin:8px 0}
.art li::marker{color:#555}
.art a:hover{text-decoration:underline}
.art strong{color:#fff}
.art table{border-collapse:collapse;width:100%;font-size:14px;margin:12px 0;display:block;overflow-x:auto}
.art th,.art td{border:1px solid #2a2a2f;padding:7px 10px;vertical-align:top}
.art th{background:#1a1a1e}
.art code{background:#1f1f24;border-radius:4px;padding:1px 5px}
.btn-ghost{border:1px solid var(--line2)!important;background:#151518!important;color:var(--sub)}
.btn-pri{background:var(--blue2)!important;color:#fff;font-weight:600}

/* 右栏 */
.panel{width:340px;flex:none;border-left:1px solid var(--line);background:var(--side);padding:28px 20px 40px}
.app.noinfo .panel{display:none}
.pback{display:none;align-items:center;gap:6px;height:44px;padding:0 10px 0 4px;margin:-14px 0 6px}
.pclose{display:flex;margin:-14px -8px 0 auto}
.prof{text-align:center;margin-top:-10px}
.prof .av{width:88px;height:88px;font-size:34px;margin:0 auto}
.prof .nm{font-size:22px;font-weight:700;margin-top:12px}
.prof .ds{font-size:13px;color:var(--muted);margin-top:2px}
.tabs{display:flex;justify-content:center;gap:6px;margin:20px 0 6px}
.tabs button{height:36px;padding:0 16px;border-radius:10px;color:var(--muted)}
.tabs button.on{background:#26262c;color:var(--text)}
.sec{font-size:13px;color:var(--muted);margin:22px 4px 8px}
.card{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:16px;background:var(--card);border:1px solid #26262b}
.card .cb{flex:1;min-width:0}
.card .ct{font-weight:600}
.card .cs{font-size:13px;color:var(--muted)}
.kv{display:flex;flex-direction:column;gap:8px;font-size:14px;padding:14px 16px;border-radius:16px;background:var(--card);border:1px solid #26262b}
.kv div{display:flex;justify-content:space-between;gap:10px}
.kv span:first-child{color:var(--sub);flex:none;white-space:nowrap}
.tog{width:50px;height:30px;flex:none;border-radius:15px;position:relative;background:#3f3f46;transition:background .2s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s}
.tog.on{background:var(--green)}.tog.on::after{left:23px}
.tog:disabled{opacity:.5;cursor:default}
.wide-btn{text-align:center;width:100%;height:44px;margin-top:12px;border:1px solid var(--line2)!important;border-radius:12px;background:#151518!important}
.wide-btn:disabled{opacity:.6;cursor:default}
.note{font-size:13px;margin:10px 4px 0;min-height:1.2em;line-height:1.6}
.note.err{color:var(--red)}
.hist{display:flex;flex-direction:column;gap:6px}
.hist button{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:var(--card)}
.hist button:hover{background:#202025}
.hist .d{flex:1}
.hist .n{font-size:12px;color:var(--muted)}
.rss{padding:12px 14px;border-radius:12px;background:var(--card);font-size:13px;word-break:break-all;color:var(--sub)}
.box{padding:16px;border-radius:16px;background:var(--card);border:1px solid #26262b;font-size:14px;line-height:1.7}
.box ol{padding-left:20px;margin:8px 0}.box li{margin:6px 0}
.box code{background:#26262c;border-radius:4px;padding:0 4px}
.inp{width:100%;margin-top:6px;padding:11px;border:1px solid var(--line2);border-radius:10px;background:#111113;color:var(--text);font:inherit;font-size:16px}
.pri-sm{height:42px;padding:0 20px;margin-top:10px;border-radius:10px;background:var(--blue2);color:#fff;font-weight:600}
.link-sm{font-size:13px;color:var(--muted);text-decoration:underline}


/* 改名、换头像 */
.av img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.avwrap{position:relative;display:block;width:88px;height:88px;margin:0 auto;border-radius:50%}
.avwrap .ovl{position:absolute;inset:0;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;
  display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s}
.tip{position:absolute;left:50%;top:calc(100% + 8px);transform:translateX(-50%);white-space:nowrap;padding:5px 10px;border-radius:8px;
  background:#2a2a30;border:1px solid #3a3a42;color:#ececef;font-size:13px;font-weight:500;pointer-events:none;opacity:0;transition:opacity .15s;z-index:5}
.avwrap:hover .tip,.nm-btn:hover .tip{opacity:1}
.avwrap.on .tip{opacity:0}
.avwrap:hover .ovl,.avwrap:focus-visible .ovl,.avwrap.on .ovl{opacity:1}

.nmrow{display:flex;justify-content:center;margin-top:12px}
.nm-btn{position:relative;display:inline-flex;align-items:center;max-width:100%;padding:4px 14px;border-radius:12px}
.nm-btn .t{font-size:22px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm-btn:hover,.nm-btn:focus-visible{background:#26262b}
.nm-edit{display:flex;justify-content:center;width:100%;max-width:240px}
.nm-edit input{flex:1;min-width:0;height:42px;padding:0 12px;border-radius:10px;border:1px solid var(--blue);background:#111113;color:var(--text);font:inherit;font-size:18px;font-weight:600;text-align:center;outline:0}
.sq{width:42px;height:42px;flex:none;border-radius:10px;display:flex;align-items:center;justify-content:center}
.sq.ok{background:var(--blue2);color:#fff}.sq.no{background:#222228;color:var(--sub)}
.av.blob{background:transparent!important}
.av.blob svg{width:100%;height:100%;overflow:visible}
.avpick{margin:14px 0 4px;padding:12px;border-radius:16px;background:var(--card);border:1px solid #2a2a30;text-align:left;box-shadow:0 12px 30px rgba(0,0,0,.35)}
.ptabs{display:flex;gap:4px;margin-bottom:10px}
.ptabs button{height:34px;padding:0 14px;border-radius:10px;color:var(--muted);font-size:14px}
.ptabs button.on{background:#26262c;color:var(--text)}
.ptabs #avReset{font-size:13px}
.shapes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.shp{aspect-ratio:1;border-radius:14px;display:flex;align-items:center;justify-content:center;padding:4px}
.shp:hover{background:#232328}.shp.on{background:#2c2c33;box-shadow:0 0 0 2px var(--blue) inset}
.cols{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0 4px}
.col{width:30px;height:30px;border-radius:50%;border:2px solid transparent!important}
.col.on{box-shadow:0 0 0 2px var(--card),0 0 0 4px #fff}
.upl{display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px 0 6px}
.upl .av.big{width:96px;height:96px}
.upl-ph{width:96px;height:96px;border-radius:50%;border:1px dashed #3a3a42;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.up{display:inline-flex;align-items:center;justify-content:center;height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--line2);cursor:pointer;font-size:14px}
.up input{display:none}
.pacts{display:flex;gap:10px;margin-top:14px}
.pacts button{flex:1;height:44px;border-radius:12px;text-align:center}
.pacts button:disabled{opacity:.45;cursor:default}

/* 结构化报告（Grok 样式版面） */
.wrap.rich{max-width:1060px}
.rich .sum{color:#d4d4d8;line-height:1.85;margin:0 0 6px}
.rich h2{font-size:20px;margin:40px 0 14px;padding:0;border:0}
.rich .must{margin:0;padding-left:24px}
.rich .must li{margin:10px 0;line-height:1.8}
.rich .must .src{color:var(--text)}
.rich .must a{color:var(--text);font-weight:600;text-decoration:underline;text-decoration-color:#555;text-underline-offset:3px}
.rich .must .ix{color:var(--sub)}
.rcards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rbox{border:1px solid var(--line2);border-radius:16px;padding:16px;background:#111113;min-width:0}
.bars{display:flex;flex-direction:column;gap:2px}
.bar{display:grid;grid-template-columns:minmax(80px,130px) 1fr 44px;align-items:center;gap:12px;font-size:13px;padding:3px 0;border-radius:6px}
.bar:hover{background:#1a1a1e}
.bar .n{color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar:first-child .n{color:var(--text)}
.bar .tr{display:block;height:6px;border-radius:3px;background:#232328;overflow:hidden}
.bar .fl{display:block;height:100%;border-radius:3px;background:#3987e5}
.bar .c{text-align:right;color:var(--text);white-space:nowrap}
.donut{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.donut svg{flex:none}
.donut .seg{cursor:default;transition:opacity .15s}
.donut svg:hover .seg{opacity:.45}.donut svg .seg:hover{opacity:1}
.lg{display:flex;flex-direction:column;gap:8px;font-size:13px;min-width:0}
.lg div{display:flex;align-items:center;gap:8px}
.lg i{width:9px;height:9px;border-radius:50%;flex:none}
.lg b{font-weight:600}.lg span{color:var(--sub)}.lg em{font-style:normal;color:var(--muted)}
.ctabs{display:flex;gap:4px 18px;flex-wrap:wrap;margin:0 0 12px;font-size:14px}
.ctabs button{padding:4px 0;color:var(--sub);border-bottom:2px solid transparent}
.ctabs button.on{color:var(--text);border-color:var(--text)}
.ctabs small{color:var(--muted);margin-left:4px}
.filt{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.filt label{display:block;font-size:12px;color:var(--muted);border:1px solid var(--line2);border-radius:14px;padding:12px 14px;background:#111113}
.filt select,.filt input{display:block;width:100%;margin-top:6px;height:36px;padding:0 10px;border:0;border-radius:8px;background:#1f1f24;color:var(--text);font:inherit;font-size:15px;outline:0}
.reset{margin:14px 0;height:34px;padding:0 14px;border-radius:17px;background:#1f1f24;font-size:13px}
.reset:hover{background:#29292f}
.tbl{border:1px solid var(--line2);border-radius:14px;overflow:hidden}
.art .tbl table{display:table;margin:0;width:100%;border-collapse:collapse;font-size:14px;table-layout:fixed}
.art .tbl th{border:0;font-size:12px;font-weight:500;color:var(--sub);text-align:left;padding:10px 12px;background:#141417;border-bottom:1px solid var(--line2)}
.art .tbl td{border:0;padding:14px 12px;vertical-align:top;border-top:1px solid #222226;line-height:1.7}
.art .tbl tr:first-child td{border-top:0}
.tbl tbody tr:hover{background:#141417}
.tag{display:inline-block;font-size:12px;padding:2px 9px;border:1px solid #34343a;border-radius:12px;background:#18181b;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.tbl .tt a{color:var(--text);font-weight:600;text-decoration:underline;text-decoration-color:#555;text-underline-offset:3px}
.tbl .tt a:hover{text-decoration-color:#fff}
.tbl .en{display:block;font-size:12px;color:var(--muted);margin-top:4px;line-height:1.5}
.tbl .ht{color:var(--text);white-space:normal}
.tbl .dt,.tbl .dl{display:block;font-size:12px;color:var(--muted)}
.tbl .dl{color:var(--chip);margin-top:2px}
.tbl .rk{color:var(--sub);font-weight:600;white-space:nowrap}
.rich .wh{color:#fbbf24}
.tbl .ht.wh{display:block;margin-bottom:2px}
.art .snapbox table{display:table;width:auto;min-width:300px;margin:0;font-size:14px;border:1px solid var(--line2);border-radius:12px;border-collapse:separate;border-spacing:0;overflow:hidden}
.art .snapbox th,.art .snapbox td{border:0;border-top:1px solid #222226;padding:8px 14px;text-align:left}
.art .snapbox th{border-top:0;background:#141417;color:var(--sub);font-size:12px;font-weight:500}
.snapbox td.up{color:#4ade80}.snapbox td.dn{color:#f87171}
.rich .lock{font-size:12px;margin-left:4px;opacity:.85}
.nomatch{padding:30px;text-align:center;color:var(--muted)}
.terms{padding-left:20px}.terms li{margin:8px 0;line-height:1.8}
@media (max-width:760px){
  .rcards,.filt{grid-template-columns:1fr}
  .tbl{border:0;border-radius:0;overflow:visible}
  .tbl thead{display:none}
  .art .tbl table,.art .tbl tbody,.art .tbl tr,.art .tbl td{display:block;width:auto}
  .tbl tr{border:1px solid var(--line2);border-radius:14px;padding:12px 14px;margin-bottom:10px;background:#111113}
  .art .tbl td{border:0;padding:3px 0}
  .art .tbl td.c-src,.art .tbl td.c-rk{display:inline-block;margin-right:8px}
  .art .tbl td.c-ht{display:flex;gap:8px;flex-wrap:wrap;align-items:baseline;color:var(--sub);font-size:13px}
  .tbl td.c-ht .dt,.tbl td.c-ht .dl{display:inline}
  .tbl .c-in{color:#d4d4d8;font-size:14px}
  .rich h2{font-size:18px;margin-top:32px}
}


/* 报告页：全屏，像 Grok 的页面 */
.page{position:fixed;top:0;right:0;bottom:0;left:320px;z-index:40;background:var(--bg);display:flex;flex-direction:column;border-left:1px solid var(--line)}
.page[hidden]{display:none}
.phdr{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;height:72px;padding:0 20px;flex:none}
.pill{display:flex;align-items:center;gap:10px;min-width:0;max-width:62vw;height:46px;padding:0 20px 0 14px;border-radius:23px;background:#16161a;border:1px solid #2a2a2f}
.pill span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
.pacts2{display:flex;justify-content:flex-end;gap:10px}
.pbtn{height:46px;padding:0 20px;border-radius:23px;border:1px solid #2a2a2f!important;background:#16161a!important;font-size:15px}
.pbtn.x{width:46px;padding:0;display:flex;align-items:center;justify-content:center}
.pbtn:hover{background:#222227!important}
.pbody{flex:1;padding:8px 24px calc(60px + env(safe-area-inset-bottom))}
.pbody .art{max-width:900px}
.pbody .art h1{font-size:40px;line-height:1.25;letter-spacing:-.3px;margin:18px 0 22px}
.pbody .art .meta{display:none}
.pbody .rich .sum{font-size:18px;line-height:1.75}
.pbody .rich h2{font-size:26px;margin:52px 0 18px}
.pbody .rich .must li{font-size:17px}
@media (max-width:899px){
  .page{left:0;border:0}
  .phdr{height:60px;padding:0 10px;grid-template-columns:0 1fr auto}
  .pill{max-width:none;justify-self:start;height:42px;padding:0 14px 0 10px}
  .pbtn{height:42px;padding:0 14px}.pbtn.x{width:42px}
  .pbody{padding:4px 16px calc(50px + env(safe-area-inset-bottom))}
  .pbody .art h1{font-size:28px;margin:10px 0 16px}
  .pbody .rich .sum{font-size:16px}
  .pbody .rich h2{font-size:21px;margin:38px 0 14px}
  .pbody .rich .must li{font-size:15px}
}

/* 手机：一次一层 */
@media (max-width:899px){
  .side,.panel{width:100%;border:0}
  .app[data-scr=list] .main,.app[data-scr=list] .panel{display:none}
  .app[data-scr=chat] .side,.app[data-scr=chat] .panel{display:none}
  .app[data-scr=profile] .side,.app[data-scr=profile] .main{display:none}
  .app.noinfo[data-scr=profile] .panel{display:block}
  .hdr{padding:0 8px;gap:8px}
  .hdr .back{display:flex}
  .body{padding:12px 12px calc(40px + env(safe-area-inset-bottom))}
  .msg>.av{display:none}
  .bubble{border-top-left-radius:18px;padding:14px 16px}
  .panel{padding:14px 16px calc(40px + env(safe-area-inset-bottom))}
  .pback{display:flex}
  .pclose{display:none}
  .art h1{font-size:22px}
  .side-top h1{font-size:24px}
  .logo{width:44px;height:44px;border-radius:13px}
  .side-top small{font-size:13px}
}
</style>
</head>
<body>
<div class="app" id="app" data-scr="list">
  <aside class="side">
    <div class="side-top">
      <span class="logo" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none">
        <defs><linearGradient id="dawn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#f43f5e"/></linearGradient></defs>
        <path d="M5 16a7 7 0 0 1 14 0z" fill="url(#dawn)"/>
        <path d="M12 3.5v2.5M4.9 7.4l1.8 1.8M19.1 7.4l-1.8 1.8" stroke="#fbbf24" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M2.5 16h19M7 19.5h10" stroke="#a1a1aa" stroke-width="1.8" stroke-linecap="round"/></svg></span>
      <div class="brand"><h1>黎明简报</h1><small id="built"></small></div>
    </div>
    <label class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8b8b93" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="搜索全部情报，空格隔开多个词" aria-label="搜索">
    </label>
    <div class="bots scroll" id="bots"></div>
  </aside>
  <main class="main">
    <header class="hdr" id="hdr"></header>
    <div class="body scroll" id="body"></div>
  </main>
  <aside class="panel scroll" id="panel"></aside>
</div>
<div class="page" id="page" hidden>
  <header class="phdr"><div></div><div class="pill" id="pPill"></div>
    <div class="pacts2"><button class="pbtn" id="pShare">分享</button>
      <button class="pbtn x" id="pX" aria-label="关闭"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div></header>
  <div class="pbody scroll" id="pageBody"></div>
</div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const IC = {
  back:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>',
  panel:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg>',
  doc:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#a1a1aa" stroke-width="2" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"/><path d="M9 12h7M9 16h7M9 8h3"/></svg>',
  clock:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8b8b93" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
};
const ls = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ v === undefined ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
};
const READ = new Set(ls.get("df_read", []));
const saveRead = () => ls.set("df_read", [...READ]);
const S = { data:null, sel:null, reading:null, scr:"list", depth:0, tab:"feed", q:"", paused:null, note:"", noteErr:false, busy:false, tokenForm:false,
  showInfo: ls.get("df_info2", false) };
const narrow = () => matchMedia("(max-width:899px)").matches;

/* ---------- 日期 ---------- */
const WD = "日一二三四五六";
const dObj = d => new Date(d + "T12:00:00+08:00");
const todayStr = () => new Date(Date.now() + 8*3600e3).toISOString().slice(0,10);
const md = d => `${+d.slice(5,7)}月${+d.slice(8,10)}日`;
const wk = d => "周" + WD[dObj(d).getUTCDay()];
function rel(d){
  const diff = Math.round((dObj(todayStr()) - dObj(d)) / 864e5);
  if(diff === 0) return "今天"; if(diff === 1) return "昨天";
  if(diff > 1 && diff < 7) return wk(d);
  return `${+d.slice(5,7)}/${+d.slice(8,10)}`;
}

/* ---------- 数据 ---------- */
const bot = id => S.data.bots.find(b => b.id === id);
const reps = id => S.data.items.filter(x => x.bot === id).sort((a,b) => a.date < b.date ? 1 : -1); // 新→旧
const latest = id => reps(id)[0];
const isPaused = id => !!(S.paused && S.paused.list.includes(id));
const av = (b, cls="") => b.img && /^data:image\//.test(b.img) ? `<span class="av ${cls}"><img src="${esc(b.img)}" alt=""></span>`
  : b.shape && SHAPE_IDS.includes(b.shape) ? `<span class="av blob ${cls}">${blobSvg(b.shape, b.color)}</span>`
  : `<span class="av ${cls}" style="background:${esc(b.color)}">${esc(b.ch)}</span>`;
const mins = r => Math.max(1, Math.round((r.words || 1500) / 500));
let IDX = null, idxP = null, qTimer = null, sideN = 50, sideQ = "";
function loadIdx(){
  if(IDX) return Promise.resolve(IDX);
  if(!idxP) idxP = fetch("search.json?" + (S.data && S.data.built ? encodeURIComponent(S.data.built) : Date.now())).then(r => { if(!r.ok) throw new Error(String(r.status)); return r.json(); }).then(d => {
    IDX = Array.isArray(d) ? d : []; return IDX;
  }).catch(() => { IDX = []; return IDX; });
  return idxP;
}
function hl(s, words){
  const text = esc(s);
  const pats = [];
  for(const w of words){
    if(!w) continue;
    const p = esc(w).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    if(p) pats.push(p);
  }
  if(!pats.length) return text;
  pats.sort((a, b) => b.length - a.length);
  return text.replace(new RegExp(pats.join("|"), "gi"), m => `<mark>${m}</mark>`);
}
function snip(x, words){
  const s = String(x || "");
  if(!s) return "";
  const low = s.toLowerCase();
  let at = -1, len = 0;
  for(const w of words){
    const i = low.indexOf(w);
    if(i >= 0 && (at < 0 || i < at)){ at = i; len = w.length; }
  }
  if(at < 0) return s.length > 60 ? s.slice(0, 60) + "…" : s;
  const a = Math.max(0, at - 30), b = Math.min(s.length, at + len + 30);
  return (a > 0 ? "…" : "") + s.slice(a, b) + (b < s.length ? "…" : "");
}

/* ---------- 导航（手机返回键也能用） ---------- */
function go(patch, push=true){
  Object.assign(S, patch);
  if(S.reading){ READ.add(S.reading); saveRead(); }
  if(push) S.depth++;
  const st = { sel:S.sel, reading:S.reading, scr:S.scr, depth:S.depth };
  const url = location.pathname + location.search + (S.reading ? "#" + S.reading : "");
  push ? history.pushState(st, "", url) : history.replaceState(st, "", url);
  render();
}
window.addEventListener("hashchange", () => {
  const id = location.hash.slice(1);
  if(S.data && id && id !== S.reading && S.data.items.some(x => x.id === id)) openRep(id);
});
window.addEventListener("popstate", e => {
  const st = e.state || { sel:S.sel, reading:null, scr: narrow() ? "list" : "chat", depth:0 };
  Object.assign(S, st); render();
});
const pickBot = id => { S.editing = false; S.avMenu = false; S.nameEdit = false; S.note = ""; S.tokenForm = false; go({ sel:id, reading:null, scr:"chat" }, narrow() || S.reading); };
const openRep = id => { const r = S.data.items.find(x => x.id === id); if(r) go({ sel:r.bot, reading:id, scr:"chat" }); };
const backBtn = () => (history.state && history.state.depth > 0) ? history.back()
  : go({ reading:null, scr: S.reading || S.scr === "profile" ? "chat" : "list" }, false);

/* ---------- 渲染 ---------- */
function render(){
  const app = $("app");
  app.dataset.scr = S.scr;
  app.classList.toggle("noinfo", !S.showInfo);
  renderSide(); renderHdr(); renderBody(); renderPanel();
}

function renderBrand(){
  const d = S.data; if(!d) return;
  const t = todayStr(), today = d.items.filter(x => x.date === t);
  const unread = d.items.filter(x => x.date === t && !READ.has(x.id)).length;
  const parts = [`${wk(t)} ${md(t)}`];
  if(today.length){ parts.push(`今天 ${today.length} 份`); parts.push(unread ? `<b>${unread} 份未读</b>` : "已全部读完"); }
  else parts.push(`${d.built.slice(11,16)} 更新`);
  $("built").innerHTML = parts.join(" · ");
}
function renderSide(){
  renderBrand();
  const rowHtml = b => {
    const r = latest(b.id), p = isPaused(b.id);
    const pv = r ? (r.items && r.items[0] ? r.items[0].title : r.excerpt) : `还没有报告 · ${b.sched}`;
    return `<button class="row ${b.id === S.sel && !narrow() ? "on" : ""} ${p ? "paused" : ""}" data-bot="${b.id}">
      ${av(b)}<span class="mid"><span class="l1"><span class="nm">${esc(b.name)}</span><span class="tm">${r ? rel(r.date) : ""}</span></span>
      <span class="l2"><span class="pv">${esc(pv)}</span>${r && !READ.has(r.id) ? '<span class="dot" aria-label="未读"></span>' : ""}${p ? '<span class="ptag">已暂停</span>' : ""}</span></span></button>`;
  };
  const bindRows = () => $("bots").querySelectorAll(".row").forEach(el => el.onclick = () => pickBot(el.dataset.bot));
  const raw = S.q.trim();
  if(!raw){
    sideQ = ""; sideN = 50;
    const list = S.data.bots;
    $("bots").innerHTML = list.length ? list.map(rowHtml).join("") : `<div class="empty" style="padding-top:40px">没有找到「${esc(S.q)}」</div>`;
    bindRows();
    return;
  }
  if(!IDX){
    $("bots").innerHTML = `<div class="empty" style="padding-top:40px">正在加载索引…</div>`;
    loadIdx().then(() => { if(S.q.trim()) renderSide(); });
    return;
  }
  if(sideQ !== raw){ sideQ = raw; sideN = 50; }
  const words = raw.split(/[ \u3000]+/).filter(Boolean).map(w => w.toLowerCase());
  const nameBots = S.data.bots.filter(b => words.every(w => b.name.toLowerCase().includes(w)));
  const hits = IDX.filter(it => {
    const hay = ((it.t || "") + (it.e || "") + (it.x || "") + (it.s || "") + (it.c || "")).toLowerCase();
    return words.every(w => hay.includes(w));
  });
  const shown = hits.slice(0, sideN);
  const head = hits.length
    ? `<div class="hitn">找到 ${hits.length} 条</div>`
    : `<div class="empty" style="padding-top:40px">没有找到「${esc(S.q)}」</div>`;
  const res = shown.map(it => {
    const b = bot(it.b);
    const title = it.t || it.e || "";
    const sx = snip(it.x || "", words);
    return `<button class="sres" type="button">
      <span class="h">${b ? av(b, "sm") : `<span class="av sm"></span>`}<span class="nm">${esc(b ? b.name : it.b)}</span><span class="tm">${it.d ? rel(it.d) : ""}</span></span>
      <span class="tt">${hl(title, words)}</span>
      ${sx ? `<span class="sx">${hl(sx, words)}</span>` : ""}
    </button>`;
  }).join("");
  const more = hits.length > shown.length ? `<button class="more50" type="button" id="more50">再显示 50 条</button>` : "";
  $("bots").innerHTML = head + nameBots.map(rowHtml).join("") + res + more;
  bindRows();
  $("bots").querySelectorAll(".sres").forEach((el, k) => el.onclick = () => {
    const it = shown[k];
    S.jump = { r: it.r, i: it.i, w: words[0] };
    openRep(it.r);
  });
  if($("more50")) $("more50").onclick = () => {
    const top = $("bots").scrollTop;
    sideN += 50;
    renderSide();
    $("bots").scrollTop = top;
  };
}

function renderHdr(){
  const b = bot(S.sel); if(!b){ $("hdr").innerHTML = ""; return; }
  const showBack = S.reading || narrow();
  $("hdr").innerHTML = `<div class="l">${showBack ? `<button class="ico-btn" id="hBack" aria-label="返回">${IC.back}</button>` : ""}</div>
    <button class="who ${S.showInfo && !narrow() ? "on" : ""}" id="hWho" aria-label="${esc(b.name)} 的资料和设置">${av(b)}
      <span class="nm">${esc(b.name)}</span>
      <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
    <div></div>`;
  if($("hBack")) $("hBack").onclick = backBtn;
  $("hWho").onclick = () => narrow() ? go({ scr:"profile" }) : setInfo(!S.showInfo);
}
const setInfo = v => { S.showInfo = v; ls.set("df_info2", v); render(); };

function renderBody(){
  const body = $("body"), b = bot(S.sel);
  if(!b){ body.innerHTML = ""; return; }
  if(S.reading) renderReader();
  else { $("page").hidden = true; S.pageShown = null; }
  const rs = reps(b.id).slice(0, 14).reverse(); // 旧→新
  if(!rs.length){ body.innerHTML = `<div class="empty">${esc(b.name)} 还没有报告<br>到 ${esc(b.sched)} 会自动出现在这里</div>`; return; }
  body.innerHTML = `<div class="wrap">` + rs.map((r, k) => {
    const full = k >= rs.length - 3 && r.items && r.items.length;
    const unread = !READ.has(r.id);
    const card = `<button class="rcard" data-open="${r.id}"><span class="ic">${IC.doc}</span>
      <span class="tx"><span class="t">${esc(r.title)}</span><span class="s">完整报告 · 约 ${mins(r)} 分钟读完${unread ? " · 未读" : ""}</span></span><span class="go">打开</span></button>`;
    const day = `<div class="day">${rel(r.date) === "今天" ? "今天 · " : rel(r.date) === "昨天" ? "昨天 · " : ""}${md(r.date)} ${wk(r.date)}</div>`;
    if(!full) return day + `<div class="msg">${av(b)}<div class="bubble old">${card}</div></div>`;
    const greet = b.id === "chiangmai" ? `${md(r.date)}起 7 天里值得去的 ${r.items.length} 个活动：` :
      `${rel(r.date) === "今天" ? "早上好！今天" : md(r.date)}的 ${r.items.length} 条必看：`;
    return day + `<div class="msg">${av(b)}<div class="bubble"><div class="greet">${esc(greet)}</div><div class="its">` +
      r.items.map(i => `<button class="it" data-open="${r.id}">${i.tag ? `<span class="chip">${esc(i.tag)}</span>` : ""}<span class="t">${esc(i.title)}</span>${i.text ? `<span class="x">${esc(i.text)}</span>` : ""}</button>`).join("") +
      `</div>${card}</div></div>`;
  }).join("") + `</div>`;
  body.querySelectorAll("[data-open]").forEach(el => el.onclick = () => openRep(el.dataset.open));
  body.scrollTop = body.scrollHeight;
}

const DOCICON = '<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 2h10l4 4v16H5z" fill="#2a2a30"/><rect x="8" y="14" width="2" height="5" rx="1" fill="#22c55e"/><rect x="11" y="11" width="2" height="8" rx="1" fill="#f59e0b"/><rect x="14" y="12.5" width="2" height="6.5" rx="1" fill="#ef4444"/><rect x="17" y="9" width="2" height="10" rx="1" fill="#3b82f6"/></svg>';
async function renderReader(){
  const id = S.reading, r = S.data.items.find(x => x.id === id), b = bot(r.bot), body = $("pageBody");
  $("page").hidden = false;
  if(S.pageShown === id){
    if(S.jump && S.jump.r === id && S.richId === id) jumpTo(id, S.richNow);
    return;
  }
  S.pageShown = id;
  $("pPill").innerHTML = DOCICON + `<span>${esc(r.title)}</span>`;
  $("pShare").textContent = "分享";
  body.innerHTML = `<div class="wrap"><div class="empty">加载中…</div></div>`;
  let html, rich = null;
  if(r.rich){ try{ rich = await (await fetch("r/" + id + ".json")).json(); }catch(e){ rich = null; } }
  if(!rich){ try{ html = await (await fetch("r/" + id + ".html")).text(); }catch(e){ html = "<p>加载失败，请刷新重试。</p>"; } }
  if(S.reading !== id) return;
  body.innerHTML = `<article class="wrap art ${rich ? "rich" : ""}"><h1>${esc(r.title)}</h1><div class="meta">${esc(b.name)} · ${md(r.date)} ${wk(r.date)}</div>
    ${rich ? richHtml(rich) : html}</article>`;
  body.scrollTop = 0;
  if(rich) bindRich(rich);
  S.richNow = rich;
  S.richId = id;
  jumpTo(id, rich);
  renderSide();
}
function jumpTo(id, rich){
  const j = S.jump;
  if(!j || j.r !== id) return;
  const body = $("pageBody");
  let el = null;
  if(rich){
    rich._f = { cat:"全部", src:"全部", q:"" };
    if($("rxSrc")) $("rxSrc").value = "全部";
    if($("rxQ")) $("rxQ").value = "";
    if($("rxTbl")) $("rxTbl").innerHTML = richTable(rich);
    if($("rxReset")) $("rxReset").textContent = `重置筛选（当前 ${richRows(rich).length} 条）`;
    document.querySelectorAll("#rxCats button").forEach(b => b.classList.toggle("on", b.dataset.cat === "全部"));
    const iid = String(j.i);
    el = [...body.querySelectorAll("tr[data-iid]")].find(tr => tr.getAttribute("data-iid") === iid);
  }else{
    const w = String(j.w || "").toLowerCase();
    const root = body.querySelector("article") || body;
    el = [...root.querySelectorAll("li, p")].find(n => w && n.textContent.toLowerCase().includes(w));
  }
  S.jump = null;
  if(!el) return;
  el.classList.remove("hit");
  void el.offsetWidth;
  el.classList.add("hit");
  el.scrollIntoView({ block:"center" });
}

/* ---------- 结构化报告：总结 / 必看 / 统计 / 可筛选速览表 / 榜单 ---------- */
const CAT_COLORS = ["#3987e5", "#d95926", "#199e70", "#c98500", "#d55181", "#0ca30c"];
const safeUrl = u => /^https?:\/\//i.test(u || "") ? u : "";
const ext = (u, t) => safeUrl(u) ? `<a href="${esc(u)}" target="_blank" rel="noopener">${t}</a>` : t;
const lock = x => x && x.paywall ? `<span class="lock" title="需要付费订阅才能看全文">🔒</span>` : "";
function donutSvg(parts, total){
  const R = 44, C = 2 * Math.PI * R, gap = parts.length > 1 ? 2 : 0;
  let off = 0;
  const segs = parts.map(p => {
    const len = Math.max(0, p.n / total * C - gap);
    const seg = `<circle class="seg" r="${R}" cx="60" cy="60" fill="none" stroke="${p.color}" stroke-width="20"
      stroke-dasharray="${len.toFixed(2)} ${(C - len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}"><title>${esc(p.name)}：${p.n} 条</title></circle>`;
    off += p.n / total * C; return seg;
  }).join("");
  return `<svg width="120" height="120" viewBox="0 0 120 120" role="img" aria-label="按分类的条数"><g transform="rotate(-90 60 60)">${segs}</g>
    <text x="60" y="58" text-anchor="middle" fill="#ececef" font-size="17" font-weight="700">${total} 条</text>
    <text x="60" y="76" text-anchor="middle" fill="#8b8b93" font-size="11">${parts.length} 大分类</text></svg>`;
}

  set(v){ S._tok = v; try{ v ? localStorage.setItem("df_gh_token", v) : localStorage.removeItem("df_gh_token"); }catch(e){} } };

  + "&description=" + encodeURIComponent("黎明简报网站：暂停/恢复 Bot、立即运行") + "&target_name=" + REPO.split("/")[0]

const PALETTE = ["#f5f5f4","#a16207","#ef4444","#f97316","#f59e0b","#22c55e","#14b8a6","#3b82f6","#8b5cf6","#ec4899","#71717a"];
const SHAPES = [
  { id:"c" }, { id:"f5", n:5, a:.16 }, { id:"sq", n:4, a:.08, r:45 }, { id:"st4", n:4, a:.3, r:20 },
  { id:"cl7", n:7, a:.07 }, { id:"t3", n:3, a:.17, r:-90 }, { id:"f6", n:6, a:.12, r:15 }, { id:"d" },
  { id:"p" }, { id:"hx", n:6, a:.05 }, { id:"sp8", n:8, a:.17, r:10 }, { id:"f9", n:9, a:.08 },
];
const SHAPE_IDS = SHAPES.map(s => s.id);
function shapePath(s){
  if(s.id === "c") return '<circle cx="50" cy="52" r="34"/>';
  if(s.id === "p") return '<rect x="14" y="30" width="72" height="46" rx="23" transform="rotate(-12 50 53)"/>';
  if(s.id === "d") return '<path d="M48 14 C66 30 82 44 82 60 a32 32 0 0 1 -64 0 C18 44 32 30 48 14Z"/>';
  const pts = [];
  for(let i = 0; i < 144; i++){
    const t = i / 144 * Math.PI * 2, r = 34 * (1 + s.a * Math.cos(s.n * (t + (s.r || 0) * Math.PI / 180)));
    pts.push((50 + r * Math.cos(t)).toFixed(1) + " " + (52 + r * Math.sin(t)).toFixed(1));
  }
  return `<path d="M${pts.join("L")}Z"/>`;
}
function blobSvg(id, color){
  const s = SHAPES.find(x => x.id === id) || SHAPES[0];
  const k = s.a ? (1 / (1 + s.a)).toFixed(3) : s.id === "d" ? .86 : s.id === "p" ? .95 : 1;
  return `<svg viewBox="15 17 70 70" width="100%" height="100%" aria-hidden="true"><g fill="${esc(color)}" transform="translate(50 52) scale(${k}) translate(-50 -52)">${shapePath(s)}</g>
    <g fill="#1c1917"><rect x="50" y="38" width="6" height="13" rx="3"/><rect x="62" y="38" width="6" height="13" rx="3"/></g></svg>`;
}

const COLORS = ["#2563eb","#0f766e","#b45309","#c2410c","#7c3aed","#15803d","#db2777","#9333ea","#0369a1","#dc2626","#ca8a04","#3f3f46"];
const okImg = s => /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(s || "");
const DEFAULTS = {};
function applyProfiles(obj){
  S.data.bots.forEach(b => {
    if(!DEFAULTS[b.id]) DEFAULTS[b.id] = Object.assign({ img:"" }, b.def || { name:b.name, ch:b.ch, color:b.color });
    const d = DEFAULTS[b.id], p = (obj && obj[b.id]) || {};
    b.name = (p.name || "").trim() || d.name; b.ch = (p.ch || "").trim() || d.ch;
    b.color = /^#[0-9a-fA-F]{6}$/.test(p.color || "") ? p.color : d.color;
    b.img = okImg(p.img) ? p.img : (p.img === "" ? "" : d.img);
    b.shape = SHAPE_IDS.includes(p.shape) ? p.shape : "";
  });
}
async function loadProfiles(){
  if(!tok.get()) return;
  try{
    const r = await gh("GET", "/variables/BOT_PROFILES");
    if(r.status === 404){ S.profiles = { exists:false, obj:{} }; }
    else if(r.ok){ let obj = {}; try{ obj = JSON.parse((await r.json()).value || "{}"); }catch(e){} S.profiles = { exists:true, obj }; }
    else return;
    applyProfiles(S.profiles.obj); render();
  }catch(e){}
}
function shrinkImage(file){
  return new Promise((ok, bad) => {
    const fr = new FileReader();
    fr.onload = () => { const im = new Image(); im.onload = () => {
      const n = 128, c = document.createElement("canvas"); c.width = c.height = n;
      const k = Math.min(im.width, im.height), x = (im.width - k) / 2, y = (im.height - k) / 2;
      c.getContext("2d").drawImage(im, x, y, k, k, 0, 0, n, n);
      let q = 0.85, out = c.toDataURL("image/jpeg", q);
      while(out.length > 11000 && q > 0.3){ q -= 0.15; out = c.toDataURL("image/jpeg", q); }
      ok(out);
    }; im.onerror = () => bad(new Error("这张图片打不开，换一张试试")); im.src = fr.result; };
    fr.onerror = () => bad(new Error("读取图片失败")); fr.readAsDataURL(file);
  });
}
async function saveProfile(b){
  const d = S.draft, def = DEFAULTS[b.id] || {};
  S.busy = true; S.note = "保存中…"; S.noteErr = false; renderPanel();
  try{
    if(!S.profiles) await loadProfiles();
    if(!S.profiles) throw new Error("读取设置失败，请检查钥匙");
    const obj = Object.assign({}, S.profiles.obj);
    const p = { name: d.name.trim(), ch: d.ch.trim(), color: d.color, img: d.img, shape: d.shape || "" };
    if(!p.shape) delete p.shape;
    if(p.name === def.name) delete p.name; if(p.ch === def.ch) delete p.ch; if(p.color === def.color) delete p.color;
    if(p.img === (def.img || "")) delete p.img;
    if(Object.keys(p).length) obj[b.id] = p; else delete obj[b.id];
    const value = JSON.stringify(obj);
    let r;
    if(!Object.keys(obj).length) r = await gh("DELETE", "/variables/BOT_PROFILES");
    else if(S.profiles.exists) r = await gh("PATCH", "/variables/BOT_PROFILES", { name:"BOT_PROFILES", value });
    else r = await gh("POST", "/variables", { name:"BOT_PROFILES", value });
    if(r.status === 403) throw new Error("钥匙权限不够：要选 daily-fetch 仓库，Variables 选 Read and write");
    if(!r.ok && r.status !== 404) throw new Error("保存失败（" + r.status + "）");
    S.profiles = { exists: Object.keys(obj).length > 0, obj };
    applyProfiles(obj); S.editing = false; S.nameEdit = false;
    const d2 = await gh("POST", "/workflows/daily.yml/dispatches", { ref:"main", inputs:{ bot:"只更新网站" } }).catch(() => null);
    S.note = d2 && d2.ok ? "✅ 已保存。这台设备马上生效，其他手机电脑大约 2 分钟后也会更新"
                         : "✅ 已保存。这台设备马上生效，其他手机电脑会在明早 Bot 运行后更新";
    S.noteErr = false;
  }catch(e){ S.note = e.message; S.noteErr = true; }
  S.busy = false; render();
}

  if(!S.paused) return;
  const list = isPaused(id) ? S.paused.list.filter(x => x !== id) : [...S.paused.list, id];
  S.busy = true; S.note = "保存中…"; S.noteErr = false; renderPanel();
  try{
    let r;
    if(!list.length) r = await gh("DELETE", "/variables/PAUSED_BOTS");
    else if(S.paused.exists) r = await gh("PATCH", "/variables/PAUSED_BOTS", { name:"PAUSED_BOTS", value:list.join(",") });
    else r = await gh("POST", "/variables", { name:"PAUSED_BOTS", value:list.join(",") });
    if(r.status === 403) throw new Error("钥匙权限不够：要选 daily-fetch 仓库，Variables 选 Read and write");
    if(!r.ok && r.status !== 404) throw new Error("保存失败（" + r.status + "）");
    S.paused = { exists: list.length > 0, list };
    S.note = list.includes(id) ? "✅ 已暂停，到点不会运行" : "✅ 已恢复运行"; S.noteErr = false;
  }catch(e){ S.note = e.message; S.noteErr = true; }
  S.busy = false; render();
}
async function runNow(id){
  if(!tok.get()){ S.tokenForm = true; return renderPanel(); }
  S.busy = true; S.note = "正在通知 GitHub…"; S.noteErr = false; renderPanel();
  try{
    const r = await gh("POST", "/workflows/daily.yml/dispatches", { ref:"main", inputs:{ bot:id } });
    if(r.status === 403 || r.status === 404) throw new Error("现在这把钥匙没有「运行」权限。点下面「重新设置钥匙」，按步骤生成一把新的就行（新链接已经包含这个权限）。");
    if(!r.ok) throw new Error("启动失败（" + r.status + "）");
    S.note = "✅ 已开始运行，大约 3～5 分钟后刷新网站就能看到新报告"; S.noteErr = false;
  }catch(e){ S.note = e.message; S.noteErr = true; }
  S.busy = false; renderPanel();
}

function tokenFormHtml(){
  return `<div class="sec">设置钥匙（每台手机或电脑做一次）</div><div class="box">
    设置后就能在这里暂停、恢复 Bot，或者立即运行一次。
    <ol>
      <li><a href="${TOKEN_URL}" target="_blank" rel="noopener">点这里打开 GitHub 创建钥匙的页面</a>（名字和权限已经帮你填好了）</li>
      <li>找到 <b>Repository access</b>，选 <b>Only select repositories</b>，下拉框里选 <b>daily-fetch</b></li>
      <li>拉到最下面点绿色 <b>Generate token</b>，弹窗里再确认一次</li>
      <li>复制以 <code>github_pat_</code> 开头的那串字，粘贴到下面，点「保存」</li>
    </ol>
    <input class="inp" id="tokIn" placeholder="github_pat_……" autocomplete="off" autocapitalize="off" spellcheck="false">
    <div style="display:flex;align-items:center;gap:14px"><button class="pri-sm" id="tokSave">保存</button>${tok.get() ? '<button class="link-sm" id="tokCancel" style="margin-top:10px">取消</button>' : ""}</div>
    <div style="font-size:12px;color:var(--muted);margin-top:10px">钥匙只存在这台设备的浏览器里，不会上传。它只能改开关和启动运行，改不了代码，也看不到你的 AI 密钥。</div></div>`;
}

function renderPanel(){
  const b = bot(S.sel), el = $("panel"); if(!b){ el.innerHTML = ""; return; }
  const rs = reps(b.id), r = rs[0], on = !isPaused(b.id), known = !tok.get() || !!S.paused;
  const rss = location.href.split("#")[0].replace(/index\.html$/, "") + "feeds/" + b.id + ".xml";
  let html = `<button class="pback" id="pBack">${IC.back}返回</button>
    <button class="ico-btn pclose" id="pClose" aria-label="收起"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    ${profHtml(b)}
    <div class="tabs"><button class="${S.tab === "feed" ? "on" : ""}" data-tab="feed">动态</button><button class="${S.tab === "lib" ? "on" : ""}" data-tab="lib">资料库</button></div>`;
  if(S.tab === "feed"){
    html += `<div class="sec">即将进行</div>
      <div class="card">${IC.clock}<div class="cb"><div class="ct">${esc(b.title)}</div>
        <div class="cs">${!known ? "读取中…" : on ? esc(b.sched) + " 左右" : "已暂停，到点不会运行"}</div></div>
        <button class="tog ${on ? "on" : ""}" id="tog" role="switch" aria-checked="${on}" aria-label="定时运行" ${S.busy || !known ? "disabled" : ""}></button></div>
      <div class="note ${S.noteErr ? "err" : ""}">${esc(S.note)}</div>
      <div class="sec">最近一次</div>
      <div class="kv"><div><span>信源</span><span style="text-align:right">${esc(b.desc)}</span></div><div><span>报告日期</span><span>${r ? md(r.date) + " " + wk(r.date) : "还没有"}</span></div>
        <div><span>报告总数</span><span>${rs.length} 份</span></div>
        <div><span>状态</span><span style="color:${on ? "#4ade80" : "var(--sub)"}">${on ? "正常运行" : "已暂停"}</span></div></div>
      <button class="wide-btn" id="runNow" ${S.busy ? "disabled" : ""}>立即运行一次</button>`;
    if(S.tokenForm || (S.noteErr && /钥匙/.test(S.note))) html += tokenFormHtml();
    else if(tok.get()) html += `<p style="text-align:center;margin-top:24px"><button class="link-sm" id="tokReset">重新设置钥匙</button></p>`;
  } else {
    html += `<div class="sec">历史报告（${rs.length}）</div><div class="hist">` +
      (rs.length ? rs.map(x => `<button data-open="${x.id}"><span class="d">${md(x.date)} ${wk(x.date)}</span><span class="n">${READ.has(x.id) ? "已读" : "未读"}</span></button>`).join("") : `<div class="note">还没有报告</div>`) +
      `</div><div class="sec">RSS 订阅</div><div class="rss">${esc(rss)}</div>
      <button class="wide-btn" id="copyRss">复制 RSS 地址</button>`;
  }
  el.innerHTML = html;
  bindProf(b);
  $("pBack").onclick = backBtn;
  $("pClose").onclick = () => setInfo(false);
  el.querySelectorAll("[data-tab]").forEach(t => t.onclick = () => { S.tab = t.dataset.tab; renderPanel(); });
  el.querySelectorAll("[data-open]").forEach(t => t.onclick = () => openRep(t.dataset.open));
  if($("tog")) $("tog").onclick = () => togglePause(b.id);
  if($("runNow")) $("runNow").onclick = () => runNow(b.id);
  if($("tokReset")) $("tokReset").onclick = () => { S.tokenForm = true; S.note = ""; renderPanel(); };
  if($("tokCancel")) $("tokCancel").onclick = () => { S.tokenForm = false; S.note = ""; S.noteErr = false; renderPanel(); };
  if($("tokSave")) $("tokSave").onclick = async () => {
    const v = $("tokIn").value.trim(); if(!v) return;
    tok.set(v); S.tokenForm = false; S.paused = null; S.note = "检查钥匙…"; S.noteErr = false; renderPanel();
    await loadPaused();
    if(!S.noteErr){ S.note = "✅ 钥匙设置好了"; renderPanel(); }
  };
  if($("copyRss")) $("copyRss").onclick = async () => {
    try{ await navigator.clipboard.writeText(rss); $("copyRss").textContent = "✅ 已复制"; }catch(e){ $("copyRss").textContent = "复制失败，请手动长按复制"; }
  };
}

/* ---------- 启动 ---------- */
$("pX").onclick = backBtn;
addEventListener("keydown", e => { if(e.key === "Escape" && S.reading) backBtn(); });
$("pShare").onclick = async () => {
  const url = location.href.split("#")[0] + "#" + S.reading, r = S.data.items.find(x => x.id === S.reading);
  try{
    if(navigator.share && matchMedia("(hover:none)").matches) await navigator.share({ title: r ? r.title : "黎明简报", url });
    else { await navigator.clipboard.writeText(url); $("pShare").textContent = "已复制链接"; setTimeout(() => $("pShare").textContent = "分享", 2000); }
  }catch(e){}
};
$("q").oninput = e => { S.q = e.target.value; clearTimeout(qTimer); qTimer = setTimeout(() => renderSide(), 150); };
let wasNarrow = narrow();
addEventListener("resize", () => { if(narrow() !== wasNarrow){ wasNarrow = narrow(); render(); } });
fetch("data.json?" + Date.now()).then(r => r.json()).then(d => {
  S.data = d;
  const hash = location.hash.slice(1), hit = d.items.find(x => x.id === hash);
  if(hit){ go({ sel:hit.bot, reading:hit.id, scr:"chat" }, false); }
  else {
    const first = d.bots.find(b => latest(b.id) && !READ.has(latest(b.id).id)) || d.bots.find(b => latest(b.id)) || d.bots[0];
    go({ sel:first.id, reading:null, scr: narrow() ? "list" : "chat" }, false);
  }
  applyProfiles(null);
  loadPaused(); loadProfiles();
}).catch(() => { $("bots").innerHTML = '<div class="empty">数据加载失败，请刷新</div>'; });
</script>
</body>
</html>
