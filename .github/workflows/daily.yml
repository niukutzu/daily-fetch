name: 每日情报

on:
  schedule:
    # GitHub 用 UTC 时间，北京时间 = UTC + 8。GitHub 定时经常会晚 5～30 分钟。
    - cron: "0 0 * * *"    # 08:00 全球科技
    - cron: "15 0 * * *"   # 08:15 国际政治
    - cron: "30 0 * * *"   # 08:30 全球金融
    - cron: "45 0 * * *"   # 08:45 Reddit
    - cron: "0 1 * * *"    # 09:00 电音与DJ
    - cron: "15 1 * * *"   # 09:15 海外商业与套利
    - cron: "30 1 * * 3"   # 周三 09:30 清迈活动
    - cron: "30 1 * * 4"   # 周四 09:30 演出与艺文
    - cron: "30 1 * * 6"   # 周六 09:30 音乐发行
  # 网站代码一改动就自动更新网站（不跑 Bot、不花 AI 额度）
  push:
    branches: [main]
    paths: ["web/**", "build_site.py"]
  workflow_dispatch:
    inputs:
      bot:
        description: "手动运行哪个 Bot"
        required: true
        default: tech
        type: choice
        options: [tech, politics, finance, reddit, music, commerce, events, releases, chiangmai, 只更新网站]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: daily-fetch
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      run: ${{ steps.pick.outputs.run }}
    steps:
      - name: 决定运行哪个 Bot
        id: pick
        run: |
          case "${{ github.event.schedule }}" in
            "0 0 * * *")  BOT=tech ;;
            "15 0 * * *") BOT=politics ;;
            "30 0 * * *") BOT=finance ;;
            "45 0 * * *") BOT=reddit ;;
            "0 1 * * *")  BOT=music ;;
            "15 1 * * *") BOT=commerce ;;
            "30 1 * * 3") BOT=chiangmai ;;
            "30 1 * * 4") BOT=events ;;
            "30 1 * * 6") BOT=releases ;;
            *) BOT="${{ inputs.bot }}" ;;
          esac
          [ -z "$BOT" ] && BOT=只更新网站
          # 暂停开关：Settings → Secrets and variables → Actions → Variables 里的 PAUSED_BOTS
          # 写 Bot 代号，多个用逗号隔开，例如 chiangmai,events。只挡定时运行，手动运行不受影响。
          RUN=true
          PAUSED=" $(echo "${{ vars.PAUSED_BOTS }}" | sed 's/，/ /g; s/,/ /g') "
          if [ "${{ github.event_name }}" = "schedule" ] && [[ "$PAUSED" == *" $BOT "* ]]; then
            RUN=false
            echo "⏸️ $BOT 已暂停（PAUSED_BOTS = ${{ vars.PAUSED_BOTS }}），这次不运行。"
          else
            echo "运行：$BOT"
          fi
          echo "bot=$BOT" >> "$GITHUB_OUTPUT"
          echo "run=$RUN" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.pick.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.pick.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        if: steps.pick.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: 抓取（不耗 AI 额度）
        if: steps.pick.outputs.run == 'true' && steps.pick.outputs.bot != '只更新网站'
        run: python fetch_all.py --bot ${{ steps.pick.outputs.bot }}

      - name: AI 写中文报告并推送
        if: steps.pick.outputs.run == 'true' && steps.pick.outputs.bot != '只更新网站'
        env:
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL || secrets.LLM_MODEL }}
          LLM_MODEL_TECH: ${{ vars.LLM_MODEL_TECH }}
          LLM_MODEL_POLITICS: ${{ vars.LLM_MODEL_POLITICS }}
          LLM_MODEL_FINANCE: ${{ vars.LLM_MODEL_FINANCE }}
          LLM_MODEL_REDDIT: ${{ vars.LLM_MODEL_REDDIT }}
          LLM_MODEL_MUSIC: ${{ vars.LLM_MODEL_MUSIC }}
          LLM_MODEL_COMMERCE: ${{ vars.LLM_MODEL_COMMERCE }}
          LLM_MODEL_EVENTS: ${{ vars.LLM_MODEL_EVENTS }}
          LLM_MODEL_RELEASES: ${{ vars.LLM_MODEL_RELEASES }}
          LLM_MODEL_CHIANGMAI: ${{ vars.LLM_MODEL_CHIANGMAI }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python write_report.py ${{ steps.pick.outputs.bot }}

      - name: 保存报告和去重记录
        if: steps.pick.outputs.run == 'true' && steps.pick.outputs.bot != '只更新网站'
        run: |
          git config user.name "daily-fetch-bot"
          git config user.email "actions@github.com"
          git add reports state
          git commit -m "报告：${{ steps.pick.outputs.bot }} $(TZ=Asia/Shanghai date +%F)" || echo "没有变化"
          git pull --rebase origin main && git push origin HEAD:main

      - name: 生成阅读器网站
        if: steps.pick.outputs.run == 'true'
        env:
          BOT_PROFILES: ${{ vars.BOT_PROFILES }}
        run: |
          # 先拉最新：别的运行刚存的报告也要带上，免得旧版本把新报告盖掉
          git pull -q --rebase origin main || echo "拉取失败，用当前版本"
          python build_site.py

      - uses: actions/upload-pages-artifact@v4
        if: steps.pick.outputs.run == 'true'
        with:
          path: site

  deploy:
    needs: run
    if: needs.run.outputs.run == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
